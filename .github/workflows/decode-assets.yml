name: Decode image assets

# The GitHub connector used by the booking bot can only commit text files.
# Images are therefore committed as base64 text in assets-b64/<name>.b64.
# This workflow decodes them into assets/<name> and commits the real binaries.
on:
  push:
    branches: [main]
    paths:
      - "assets-b64/**"
      - ".github/workflows/decode-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decode-assets
  cancel-in-progress: false

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode base64 files into assets/
        run: |
          set -euo pipefail
          mkdir -p assets
          shopt -s nullglob
          for f in assets-b64/*.b64; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "assets/$name"
            echo "decoded $f -> assets/$name ($(stat -c%s "assets/$name") bytes)"
          done

      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Decode image assets from assets-b64 [skip ci]"
            git push
          fi
